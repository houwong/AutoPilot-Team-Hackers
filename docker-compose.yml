# docker-compose.yml
# AutoPilot Template — Docker Compose for local development

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app/app
      - ./utils:/app/utils
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - document_storage:/app/document_storage
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - AUTH_BYPASS=${AUTH_BYPASS:-true}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # .env sets FRONTEND_TARGET=dev but this was hardcoded to prod, so the
      # variable had no effect and the container shipped a pre-built bundle with
      # no source. Frontend changes were invisible until the image was rebuilt.
      target: ${FRONTEND_TARGET:-prod}
      args:
        - NEXTAUTH_URL=${NEXTAUTH_URL}
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-}
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # The dev stage runs `next dev`, which needs NODE_ENV=development to
      # enable hot reload; prod keeps the built server.
      - NODE_ENV=${FRONTEND_NODE_ENV:-production}
    volumes:
      # Mounted so edits are picked up without a rebuild under the dev target.
      # The prod target serves .next and ignores them for rendering — but they
      # still let `npx tsc --noEmit` run against the real source, which is worth
      # keeping: it has caught errors the browser would not have surfaced until
      # the page was opened.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      # NextAuth Session augmentation lives here; without it every page that
      # reads session.roles or session.accessToken fails to typecheck.
      - ./frontend/types:/app/types
      # Do NOT bind-mount next-env.d.ts. Next.js generates it, so it can be
      # absent when compose starts — and Docker creates a DIRECTORY for a
      # missing bind source, which then breaks `npm run build` with
      # "EISDIR: illegal operation on a directory".
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  document_storage:

networks:
  app-network:
    driver: bridge
